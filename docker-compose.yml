services:
  db:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME}-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ccb_queue}
      POSTGRES_USER: ${POSTGRES_USER:-ccb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ccb_pass_2026}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - branch-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ccb} -d ${POSTGRES_DB:-ccb_queue}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-ccb_queue}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-ccb}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-ccb_pass_2026}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      TZ: Asia/Shanghai
    ports:
      # 仅发布应用端口；数据库不发布到宿主，只在 compose 内网通过服务名 db 访问
      - "${CC_PUBLISH_PORT}:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - branch-net
    restart: unless-stopped

networks:
  branch-net:
    driver: bridge

volumes:
  pgdata:
