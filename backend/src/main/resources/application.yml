server:
  port: 8080

spring:
  application:
    name: branch-queue
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ccb_queue}
    username: ${SPRING_DATASOURCE_USERNAME:ccb}
    password: ${SPRING_DATASOURCE_PASSWORD:ccb_pass_2026}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    open-in-view: true
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai

management:
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    com.ccb.queue: INFO
